name = "hydro-bot"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Runs every minute so reminders fire on time. Cloudflare's minimum cron
# granularity is 1 minute.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"                  # accessible in code as env.DB
database_name = "hydro-bot-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Secrets (set with `wrangler secret put <NAME>`, do NOT put real values here):
#   DISCORD_TOKEN         - bot token, used for the REST API (sending messages)
#   DISCORD_PUBLIC_KEY    - used to verify interaction request signatures
#   DISCORD_APPLICATION_ID - your application's ID, used when registering commands
