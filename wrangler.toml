name = "red-bot"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Runs every minute so reminders fire on time. Cloudflare's minimum cron
# granularity is 1 minute.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "redllamaaa_d1"
database_id = "fff259f6-cb3e-4b8a-8ff4-49f06d55a328"